<!doctype html>
<html>
  <head>
    <title>Talk Space Locator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      gmpx-store-locator {
        width: 100%;
        height: 100%;
        --gmpx-color-surface: #fff;
        --gmpx-color-on-surface: #212121;
        --gmpx-color-on-surface-variant: #757575;
        --gmpx-color-primary: #1967d2;
        --gmpx-color-outline: #e0e0e0;
        --gmpx-fixed-panel-width-row-layout: 28.5em;
        --gmpx-fixed-panel-height-column-layout: 65%;
        --gmpx-font-family-base: "Roboto", sans-serif;
        --gmpx-font-family-headings: "Roboto", sans-serif;
        --gmpx-font-size-base: 0.875rem;
        --gmpx-hours-color-open: #188038;
        --gmpx-hours-color-closed: #d50000;
        --gmpx-rating-color: #ffb300;
        --gmpx-rating-color-empty: #e0e0e0;
      }
    </style>
    <script src="https://storage.googleapis.com/maps-solutions-zi7n2j7043/locator-plus/mvqd/locator-plus-config.js"></script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", async () => {
        await customElements.whenDefined("gmpx-store-locator");
        const apiLoader = document.querySelector("gmpx-api-loader");
        const locator = document.querySelector("gmpx-store-locator");
        const locations = CONFIGURATION.locations || [];

        for (const location of locations) {
          // Match the office identity, not its position in the external configuration.
          if (location.placeId === "ChIJj3SFRuaNOxARxdxE2VFox40") {
            location.title = "Talk Space Counseling, Lagos";
          }
          for (const action of location.actions || []) {
            if (action.defaultUrl === "https://paystack.shop/tscs") {
              action.defaultUrl = "/book";
            }
          }
        }
        apiLoader.setAttribute("key", CONFIGURATION.mapsApiKey);
        locator.configureFromQuickBuilder(CONFIGURATION);
      });
    </script>
  </head>
  <body>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.15/index.min.js"
    ></script>
    <gmpx-api-loader solution-channel="GMP_QB_locatorplus_v11_cABDFX"></gmpx-api-loader>
    <gmpx-store-locator map-id="DEMO_MAP_ID"></gmpx-store-locator>
  </body>
</html>
